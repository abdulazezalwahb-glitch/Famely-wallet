<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>محفظة العائلة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ef;--card:#fff;--tx:#1d1d1f;--mu:#7a7a80;--ac:#0f766e;--ac2:#14b8a6;--bd:#e7e4de;--rd:#e11d48;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1514;--card:#182120;--tx:#ecf3f1;--mu:#8fa09c;--ac:#2dd4bf;--ac2:#0f766e;--bd:#253230;--rd:#fb7185;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1514;--card:#182120;--tx:#ecf3f1;--mu:#8fa09c;--ac:#2dd4bf;--ac2:#0f766e;--bd:#253230;--rd:#fb7185;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Tajawal',system-ui,sans-serif;padding-bottom:96px}
.wrap{max-width:560px;margin:auto;padding:14px}
.hero{background:linear-gradient(135deg,var(--ac2),#115e59);color:#fff;border-radius:22px;padding:18px;box-shadow:0 8px 24px #0f766e33}
.hero small{opacity:.85}.hero .big{font-size:34px;font-weight:800;margin:2px 0}
.hero .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero select{background:#ffffff26;color:#fff;border:0;border-radius:12px;padding:6px 10px;font:inherit}
.hero select option{color:#000}
#trip{flex:1;min-width:0;font-weight:700}.tb{background:#ffffff26;color:#fff;border:0;border-radius:12px;padding:6px 12px;font:inherit;font-weight:800}.row{justify-content:flex-start!important}.row #base{margin-inline-start:auto}.rr input{flex:none;min-width:0}.rr input:not([style*="width"]){flex:1}.pb{height:10px;background:#ffffff33;border-radius:10px;overflow:hidden;margin-top:12px}.pb i{display:block;height:100%;background:#fff;border-radius:10px}.bt{font-size:13px;margin-top:6px;display:flex;justify-content:space-between}.warn{background:#fbbf24;color:#422006;border-radius:12px;padding:6px 10px;margin-top:8px;font-size:13px;font-weight:700}.over{background:#e11d48;color:#fff}#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:14px;z-index:50;opacity:0;pointer-events:none;transition:.2s;max-width:90%;text-align:center;font-weight:700}#toast.on{opacity:1}
.mini{display:flex;gap:8px;margin-top:12px}
.mini div{flex:1;background:#ffffff1f;border-radius:14px;padding:8px 10px;font-size:13px}
.mini b{display:block;font-size:16px}
.tabs{display:flex;gap:6px;margin:14px 0;background:var(--card);padding:5px;border-radius:16px;border:1px solid var(--bd)}
.tabs button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-weight:700;padding:9px;border-radius:12px}
.tabs button.on{background:var(--ac);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px}
.day{font-weight:800;margin:14px 4px 6px;display:flex;justify-content:space-between;color:var(--mu);font-size:14px}
.it{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--card);border:1px solid var(--bd);border-radius:16px;margin-bottom:7px}
.ic{width:42px;height:42px;border-radius:13px;background:var(--bg);display:grid;place-items:center;font-size:22px;flex:none}
.it .m{flex:1;min-width:0}.it .m b{display:block}.it .m span{font-size:12px;color:var(--mu)}
.it .a{text-align:left;direction:ltr;font-weight:800}.it .a span{display:block;font-size:12px;color:var(--mu);font-weight:500}
.bar{height:9px;background:var(--bg);border-radius:9px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));border-radius:9px}
.br{margin-bottom:11px}.br .t{display:flex;justify-content:space-between;font-size:14px}
h3{margin:0 0 10px;font-size:16px}
.cols{display:flex;gap:8px}.cols>*{flex:1}
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ac);color:var(--bg);border:0;border-radius:30px;padding:15px 30px;font:inherit;font-weight:800;font-size:17px;box-shadow:0 8px 24px #0004}
input,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:13px;padding:11px;margin-top:4px}
label{font-size:13px;color:var(--mu);display:block;margin-top:10px}
.sheet{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}
.sheet.on{display:flex}
.pan{background:var(--card);width:100%;max-width:560px;margin:auto;border-radius:24px 24px 0 0;padding:18px;max-height:92%;overflow:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.chip{border:1px solid var(--bd);background:var(--bg);border-radius:20px;padding:7px 12px;font-size:14px;color:var(--tx)}
.chip.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:800;font-size:16px;background:var(--ac);color:var(--bg);margin-top:16px}
.btn.d{background:none;color:var(--rd);margin-top:4px}
.amt{font-size:28px;font-weight:800;text-align:center;direction:ltr}
.res{font-size:26px;font-weight:800;text-align:center;direction:ltr;color:var(--ac);margin-top:10px}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.rr{display:flex;align-items:center;gap:8px;margin-bottom:8px}.rr span{width:120px;font-size:14px}.rr input{margin:0;direction:ltr}
.si{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}.chip .si,.btn .si{width:16px;height:16px}.ic{color:var(--ac)}.code{font-size:30px;font-weight:800;letter-spacing:5px;direction:ltr;color:var(--ac)}.qrb{background:#fff;padding:12px;border-radius:14px;display:inline-block;margin:10px 0}.qrb svg{display:block;width:190px;height:190px}video{width:100%;border-radius:14px;margin-top:10px}
.tabs button{font-size:13px;padding:9px 2px}.row2{display:flex;justify-content:space-between;align-items:center;gap:8px}.tag{font-size:12px;background:var(--bg);color:var(--ac);padding:3px 10px;border-radius:10px;font-weight:700}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--ac);color:var(--bg);display:inline-grid;place-items:center;font-weight:800;font-size:13px;flex:none;font-style:normal}.av.big{width:64px;height:64px;font-size:26px}.avs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.who{display:flex;align-items:center;gap:6px}
.tr{padding:9px 0;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:7px}.trn,.trb{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.ar{color:var(--mu);font-size:13px}
.avb{display:inline-block;margin:0!important;cursor:pointer}label.sw{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:14px}.sw input{width:auto;margin:0}
.cc{margin-top:14px;border-radius:18px;padding:16px;color:#fff;background:linear-gradient(135deg,#115e59,#0f766e 60%,#14b8a6);direction:ltr}.ccn{font-size:21px;font-weight:800;letter-spacing:2px;margin-bottom:14px;direction:ltr}.cc .row2{direction:rtl}
.day{cursor:pointer}.day .si{width:16px;height:16px;transition:.2s}.day.cl .si{transform:rotate(90deg)}
.se{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:8px}.se.sp{border-color:var(--ac)}.se small{color:var(--mu);display:block;margin:2px 0 4px}.sd{font-size:13px}
.msg{max-width:84%;background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:8px 10px;align-self:flex-start;word-break:break-word}.msg.me{align-self:flex-end;background:var(--ac);color:var(--bg);border-color:var(--ac)}.msg small{display:block;opacity:.7;font-size:11px;margin-bottom:2px}.msg img.stk{width:110px;height:110px;object-fit:contain;display:block}
#cm{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:8px 2px}.cin{display:flex;gap:6px;align-items:center;padding-top:8px}.cin input{margin:0;flex:1;min-width:0}
.tray{display:flex;gap:8px;overflow-x:auto;padding:8px 0}.tray img{width:64px;height:64px;object-fit:contain;border:1px solid var(--bd);border-radius:10px;background:var(--bg);flex:none}
.bdg{background:var(--rd);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;margin-inline-start:4px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
</head>
<body>
<div class="wrap">
 <div id="an" style="font-weight:800;font-size:18px;margin:2px 4px 10px"></div>
 <div class="hero">
  <div class="row"><select id="trip" onchange="S.trip=this.value;save();sub()"></select><button class="tb" onclick="newTrip()">＋</button><select id="base" onchange="S.base=this.value;save();draw()"></select></div>
  <div class="big" id="tot">0</div>
  <div class="mini"><div>اليوم<b id="today">0</b></div><div>المعدل اليومي<b id="avg">0</b></div><div>عدد العمليات<b id="cnt">0</b></div></div><div id="bud"></div>
 </div>
 <div class="tabs"><button class="on" onclick="tab(0)">المصاريف</button><button onclick="tab(1)">إحصائيات</button><button onclick="tab(2)">العملات</button><button onclick="tab(3)">المجموعات</button><button onclick="tab(4)">إعدادات</button></div>
 <div id="p0"></div><div id="p1" hidden></div><div id="p2" hidden></div><div id="p3" hidden></div><div id="p4" hidden></div>
</div>
<button class="fab" onclick="openSheet()">＋ مصروف جديد</button>

<div class="sheet" id="sh" onclick="if(event.target===this)closeSheet()"><div class="pan">
 <h3 id="shT">مصروف جديد</h3>
 <input class="amt" id="fa" type="number" inputmode="decimal" placeholder="0.00">
 <div class="cols"><div><label>العملة</label><select id="fc"></select></div><div><label>الملاحظة</label><input id="fn" placeholder="مثلاً: غداء"></div></div>
 <label>الفئة</label><div class="chips" id="fcat"></div><div id="fsp"></div>
 <div class="cols"><div><label>التاريخ</label><input type="date" id="fd"></div><div><label>الوقت</label><input type="time" id="ft"></div></div>
 <button class="btn" onclick="saveItem()">حفظ</button>
 <button class="btn d" id="del" onclick="delItem()" hidden>حذف المصروف</button>
</div></div>

<div class="sheet" id="dlg" style="align-items:center;z-index:40"><div class="pan" style="border-radius:22px;max-width:360px;margin:auto;width:92%"><div id="dm" style="font-weight:700;margin-bottom:8px"></div><input id="di" hidden><div class="cols"><button class="btn" onclick="dok()">تأكيد</button><button class="btn d" style="color:var(--tx)" onclick="$('dlg').classList.remove('on')">إلغاء</button></div></div></div><div id="toast"></div>
<div class="sheet" id="ch" onclick="if(event.target===this)closeChat()"><div class="pan" style="height:92%;display:flex;flex-direction:column;overflow:hidden"><div class="row2"><h3 id="cht" style="margin:0"></h3><button class="chip" onclick="closeChat()">إغلاق</button></div><div id="cm"></div><div id="tray" hidden><div class="tray" id="trI"></div></div><div class="cin"><button class="chip" onclick="trayT()">ملصق</button><input id="ci" placeholder="اكتب رسالة" onkeydown="if(event.key=='Enter')sendT()"><button class="chip" id="mic" onclick="rec_()">تسجيل</button><button class="chip" onclick="sendT()">إرسال</button></div></div></div>
<div class="sheet" id="st" onclick="if(event.target===this)$('st').classList.remove('on')"><div class="pan"><div id="stb"></div></div></div>
<div class="sheet" id="ob" style="align-items:center;z-index:60"><div class="pan" style="border-radius:22px;max-width:380px;margin:auto;width:92%"><h3>أهلاً بك في محفظة العائلة</h3><small style="color:var(--mu)">اكتب بياناتك حتى يتعرف عليك أفراد عائلتك</small><label>الاسم</label><input id="on" maxlength="30"><label>رقم الهاتف</label><input id="op" inputmode="tel" style="direction:ltr" placeholder="07xxxxxxxxx"><button class="btn" onclick="obSave()">متابعة</button></div></div>
<div class="sheet" id="gs" onclick="if(event.target===this)$('gs').classList.remove('on')"><div class="pan"><h3>مجموعة جديدة</h3><label>الاسم</label><input id="gn" placeholder="مثلاً: بيتنا"><label>النوع</label><select id="gk"><option value="fam">العائلة (البيت الواحد)</option><option value="ext">العائلة الكبيرة</option></select><button class="btn" onclick="mkG()">إنشاء</button><h3 style="margin-top:22px">الانضمام برقم أو QR</h3><input id="jc" maxlength="6" placeholder="ABC123" style="direction:ltr;text-transform:uppercase"><div class="cols"><button class="btn" onclick="joinC($('jc').value.trim().toUpperCase())">انضمام</button><button class="btn" onclick="scan()">مسح QR</button></div><div id="sc"></div></div></div>
<script>
const IC={fork:'<path d="M7 3v8M5 3v5a2 2 0 004 0V3M7 11v10M17 3c-2 2-3 5-3 8h3v10"/>',cup:'<path d="M4 8h13v6a5 5 0 01-5 5H9a5 5 0 01-5-5zM17 10h2a2 2 0 010 5h-2M7 3v2M11 3v2"/>',car:'<path d="M5 16v-5l2-5h10l2 5v5zM5 16v3M19 16v3M8 13h.01M16 13h.01"/>',home:'<path d="M3 11l9-8 9 8v10H3z"/>',bag:'<path d="M5 8h14l-1 13H6zM9 8V6a3 3 0 016 0v2"/>',tick:'<path d="M3 6h18v3a2 2 0 000 6v3H3v-3a2 2 0 000-6z"/>',phone:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',chev:'<path d="M6 9l6 6 6-6"/>'};
const CK=['fork','cup','car','home','bag','tick','phone','box'];
const ic=k=>`<svg class="si" viewBox="0 0 24 24">${IC[k]||IC.box}</svg>`;
const CATS=[['طعام','fork'],['قهوة','cup'],['مواصلات','car'],['سكن','home'],['تسوق','bag'],['ترفيه','tick'],['اتصالات','phone'],['أخرى','box']];
const ci=n=>ic((S.cats.find(c=>c[0]==n)||[0,'box'])[1]);
const ME={id:'me',name:'حسابي الشخصي',kind:'me',ppl:[]};
let S={base:'IQD',rates:{USD:1,IQD:1310,TRY:42,EUR:0.86},items:[],cats:CATS.map(c=>c.slice()),trips:[ME],trip:'me'};
try{const r=JSON.parse(localStorage.getItem('fw1')||'{}');['base','rates','cats','trip'].forEach(k=>{if(r[k])S[k]=r[k]})}catch(e){}
let me='';try{me=localStorage.getItem('fn')||''}catch(e){}
const jm=(location.hash.match(/^#join-([A-Z0-9]{6})$/)||[])[1]||'';
let CS={};try{CS=JSON.parse(localStorage.getItem('cs')||'{}')}catch(e){}
const isC=(k,d)=>k in CS?CS[k]:!!d;
function tc(k,d){CS[k]=isC(k,d)?0:1;try{localStorage.setItem('cs',JSON.stringify(CS))}catch(e){}draw()}
let STX='';
const IT=()=>S.items.filter(x=>x.p==S.trip&&!x.pay);
const save=()=>{try{localStorage.setItem('fw1',JSON.stringify({base:S.base,rates:S.rates,cats:S.cats,trip:S.trip}))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cv=(a,f,t=S.base)=>a/S.rates[f]*S.rates[t];
const fmt=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:n<100?2:0});
let cat='طعام',edit=null,curTab=0;
const nowD=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const nowT=()=>new Date().toTimeString().slice(0,5);
function tab(i){curTab=i;[0,1,2,3,4].forEach(k=>{$('p'+k).hidden=k!=i;document.querySelectorAll('.tabs button')[k].classList.toggle('on',k==i)});draw()}
function opts(sel){return Object.keys(S.rates).map(c=>`<option ${c==sel?'selected':''}>${c}</option>`).join('')}
function openSheet(id){
 edit=id||null;const it=S.items.find(x=>x.id==id);
 $('shT').textContent=it?'تعديل المصروف':'مصروف جديد';$('del').hidden=!it;
 $('fa').value=it?it.a:'';$('fn').value=it?it.n:'';cat=it?it.c:S.cats[0][0];
 $('fc').innerHTML=opts(it?it.cur:(localStorage.getItem('lc')||'IQD'));
 $('fd').value=it?it.d:nowD();$('ft').value=it?it.t:nowT();
 chips();split(it);$('sh').classList.add('on');setTimeout(()=>$('fa').focus(),100)}
const closeSheet=()=>$('sh').classList.remove('on');
function chips(){$('fcat').innerHTML=S.cats.map((c,i)=>`<button class="chip ${c[0]==cat?'on':''}" onclick="cat=S.cats[${i}][0];chips()">${ic(c[1])} ${esc(c[0])}</button>`).join('')}
function saveItem(){
 const a=parseFloat($('fa').value);if(!a||a<=0){$('fa').focus();return}
 const o={id:edit||Date.now(),k:'i',u:uid,p:S.trip,a,cur:$('fc').value,c:cat,n:$('fn').value.trim(),d:$('fd').value||nowD(),t:$('ft').value||nowT()};
 if(pm)o.pm=pm;if(pays.length&&spl.length){o.ws=[...pays];o.w=pays[0];o.s=[...spl]}else if((curTrip().ppl||[]).length>1){alert('اختر دافعاً ومستفيداً واحداً على الأقل');return}
 const bb=bud();if(bb&&!edit){const t0=IT().reduce((q,x)=>q+cv(x.a,x.cur),0),t1=t0+cv(a,$('fc').value);if(t0<bb&&t1>=bb)notify('b100',{group:curTrip().name,pct:100});else if(t0<bb*.8&&t1>=bb*.8)notify('b80',{group:curTrip().name,pct:80})}
 try{localStorage.setItem('lc',o.cur)}catch(e){}
 IC_().doc('i'+o.id).set(o);closeSheet()}
function delItem(){ask('حذف هذا المصروف؟',()=>{IC_().doc('i'+edit).delete();closeSheet()})}
const dayName=d=>new Date(d+'T12:00').toLocaleDateString('ar-IQ',{weekday:'long',day:'numeric',month:'long'});

function draw(){$('an').textContent=SYS.name||'محفظة العائلة';
 $('base').innerHTML=opts(S.base);$('trip').innerHTML=S.trips.map(t=>`<option value="${t.id}" ${t.id==S.trip?'selected':''}>${t.kind=='fam'?'العائلة · ':t.kind=='ext'?'الكبيرة · ':''}${esc(t.name)}</option>`).join('');
 const its=IT(),tot=its.reduce((s,x)=>s+cv(x.a,x.cur),0);
 const days=new Set(its.map(x=>x.d));
 let span=1;if(its.length){const ds=[...days].sort();span=Math.max(1,Math.round((new Date(ds[ds.length-1])-new Date(ds[0]))/864e5)+1)}
 $('tot').textContent=fmt(tot)+' '+S.base;
 $('today').textContent=fmt(its.filter(x=>x.d==nowD()).reduce((s,x)=>s+cv(x.a,x.cur),0));
 $('avg').textContent=fmt(tot/span);$('cnt').textContent=its.length;
 const b=bud();$('bud').innerHTML=b?`<div class="pb"><i style="width:${Math.min(100,tot/b*100)}%"></i></div><div class="bt"><span>${Math.round(tot/b*100)}% من الميزانية</span><span>${tot<=b?'المتبقي '+fmt(b-tot):'تجاوز بـ '+fmt(tot-b)} ${S.base}</span></div>`+(tot>b?'<div class="warn over"> تجاوزت الميزانية!</div>':tot>=b*.8?'<div class="warn">تنبيه: اقتربت من نهاية الميزانية</div>':''):'<button class="tb" style="margin-top:10px" onclick="tab(4)">حدد ميزانية المجموعة</button>';
 if(curTrip().kind!='me'&&(curTrip().ppl||[]).length<2)$('bud').innerHTML+=' <button class="tb" style="margin-top:10px" onclick="tab(4)">ادعُ أفراد العائلة للتقسيم</button>';
 if(curTab==0)list();else if(curTab==1)stats(tot,span);else if(curTab==2)rates();else if(curTab==3)groupsTab();else if(!(document.activeElement&&document.activeElement.tagName=='INPUT'&&$('p4').contains(document.activeElement)))sett()}

function list(){
 if(!IT().length){$('p0').innerHTML='<div class="empty">لا توجد مصاريف بعد <br>اضغط «مصروف جديد» للبدء</div>';return}
 const g={};IT().forEach(x=>(g[x.d]=g[x.d]||[]).push(x));
 $('p0').innerHTML=Object.keys(g).sort().reverse().map(d=>{
  const rows=g[d].sort((a,b)=>b.t.localeCompare(a.t));
  const ds=rows.reduce((s,x)=>s+cv(x.a,x.cur),0);

async function scan(){const b=$('sc');try{if(!('BarcodeDetector' in window))throw 0;stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});b.innerHTML='<video id="vd" playsinline muted></video>';const v=$('vd');v.srcObject=stream;await v.play();const det=new BarcodeDetector({formats:['qr_code']});

 return `<div class="card"><h3>أرشيف التسديدات</h3>${Object.keys(m).sort().reverse().map(ym=>{const k='m:'+t.id+':'+ym,df=ym<cur,o=isC(k,df),tot=m[ym].reduce((q,x)=>q+cv(x.a,x.cur),0);
  return `<div class="day ${o?'cl':''}" onclick="tc('${k}',${df})" style="margin:8px 0 4px"><span class="who">${ic('chev')}${new Date(ym+'-01T12:00').toLocaleDateString('ar-IQ',{month:'long',year:'numeric'})} · ${m[ym].length}</span><span>${fmt(tot)} ${S.base}</span></div>`+(o?'':m[ym].map(x=>`<div class="tr"><div class="trn">${av(t,x.w)}<b>${esc(nm(t,x.w))}</b><span class="ar">سدّد إلى</span>${av(t,x.s[0])}<b>${esc(nm(t,x.s[0]))}</b></div><div class="trb"><b>${fmt(x.a)} ${x.cur}</b><small style="color:var(--mu)">${dayName(x.d)} · ${x.t}</small></div></div>`).join(''))}).join('')}</div>`}
function stmt(g){const t=S.trips.find(x=>x.id==g);if(!t)return;
 const P=t.ppl||[],f=n=>fmt(n)+' '+S.base,N=id=>nm(t,id),M={};P.forEach(p=>M[p]={ep:0,es:0,ps:0,pr:0});

  const mt=x.pm=='card'?'بطاقة':x.pm=='cash'?'كاش':'',ty=py?'تسديد':'مصروف',w1=ws.map(w=>N(w)+' ('+f(v/ws.length)+')').join('، '),s1=s.map(w=>N(w)+' ('+f(v/s.length)+')').join('، ');
  ent.push(`${x.d} ${x.t} | ${ty} | ${py?'':(x.n||x.c)+' | '}${fmt(x.a)} ${x.cur}${x.cur!=S.base?' (≈ '+f(v)+')':''} | ${mt?mt+' | ':''}دفع: ${w1||'-'} | لـ: ${s1||'-'}`);
  return `<div class="se ${py?'sp':''}"><div class="row2"><b>${py?'تسديد':esc(x.n||x.c)}</b><b>${fmt(x.a)} ${x.cur}</b></div><small>${dayName(x.d)} · ${x.t} · ${ty}${py?'':' · '+esc(x.c)}${mt?' · '+mt:''}${x.cur!=S.base?' · ≈ '+f(v):''}${py?'':' · تراكمي '+f(run)}</small>${ws.length?`<div class="sd">الدافع: ${esc(w1)}</div><div class="sd">المستفيد: ${esc(s1)}</div>`:'<div class="sd">بدون تقسيم</div>'}</div>`}).join('');
 const c=calc(t),b=t.b>0?cv(t.b,t.bc||S.base):0,mem=[];
 const mh=P.map(p=>{const m=M[p],n=m.ep-m.es+m.ps-m.pr;mem.push(`${N(p)}: دفع ${f(m.ep)} | حصته ${f(m.es)} | سدّد ${f(m.ps)} | استلم ${f(m.pr)} | ${n>=0?'له ':'عليه '}${f(Math.abs(n))}`);
  return `<div class="br"><div class="t"><span class="who">${av(t,p)}${esc(N(p))}</span><b style="color:${n>=0?'var(--ac)':'var(--rd)'}">${n>=0?'له ':'عليه '}${f(Math.abs(n))}</b></div><small style="color:var(--mu)">دفع مصاريف ${f(m.ep)} · حصته ${f(m.es)} · سدّد ${f(m.ps)} · استلم ${f(m.pr)}</small></div>`}).join('');
 const rem=c.tr.map(x=>`${N(x.f)} يدفع إلى ${N(x.t)}: ${f(x.a)}`);
 STX=[`كشف حساب: ${t.name}`,`إجمالي المصاريف: ${f(tsp)} | التسديدات: ${f(tpy)}${b?' | الميزانية: '+f(b)+' | المتبقي: '+f(b-tsp):''}`,'','الأعضاء:',...mem,'','المتبقي للتسوية:',...(rem.length?rem:['لا يوجد']),'','التفاصيل:',...ent].join('\n');
 $('stb').innerHTML=`<div class="row2"><h3 style="margin:0">كشف حساب ${esc(t.name)}</h3><span class="tag">${its.length} عملية</span></div>
 <div class="mini" style="color:var(--tx)"><div style="background:var(--bg)">المصاريف<b>${fmt(tsp)}</b></div><div style="background:var(--bg)">التسديدات<b>${fmt(tpy)}</b></div><div style="background:var(--bg)">${b?'المتبقي':'العملة'}<b>${b?fmt(b-tsp):S.base}</b></div></div>
 <h3 style="margin-top:16px">الأعضاء (${S.base})</h3>${mh}<h3>المتبقي للتسوية</h3>${rem.length?rem.map(x=>`<div style="padding:4px 0">${esc(x)}</div>`).join(''):'<div style="color:var(--mu)">لا يوجد</div>'}
 <h3 style="margin-top:16px">كل العمليات بالتفصيل</h3>${rows||'<div class="empty">لا توجد عمليات</div>'}
 <div class="cols"><button class="btn" onclick="cp(STX)">نسخ الكشف كنص</button><button class="btn d" style="color:var(--tx)" onclick="$('st').classList.remove('on')">إغلاق</button></div>`;
 $('st').classList.add('on')}
